<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Torque Intel Evaluation</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="page-container">

        <header class="hero">
            <p class="eyebrow">TORQUE INTEL</p>

            <h1>Evaluation</h1>

            <p class="subtitle">
                Runs every case in test-cases.json three times
                through the security / scope guard and the
                coordinating agent.
            </p>
        </header>

        <button id="runEvalButton" class="primary-button" type="button">
            Run Evaluation
        </button>

        <section
            id="evalStatus"
            class="status-area"
            aria-live="polite"
        ></section>

        <section id="evalSummary" class="eval-summary"></section>

        <section id="evalResults"></section>

        <footer class="page-footer">
            <a href="../index.html">Back to Torque Intel</a>
        </footer>

    </main>

    <script src="../agent.js"></script>
    <script src="run-eval.js"></script>

</body>
</html>
