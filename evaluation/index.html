<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Torque Intel Evaluation</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="page-container">

        <header class="hero">
            <p class="eyebrow">TORQUE INTEL</p>

            <h1>Evaluation</h1>

            <p class="subtitle">
                Runs every test case three times through the
                security / scope guard and the coordinating agent,
                then reports pass@1 and pass^3.
            </p>
        </header>

        <div class="button-row">
            <button id="runEvalButton" class="primary-button" type="button">
                Run Evaluation
            </button>

            <button
                id="downloadResultsButton"
                class="secondary-button"
                type="button"
                hidden
            >
                Download results.json
            </button>
        </div>

        <section
            id="evalStatus"
            class="status-area"
            aria-live="polite"
        ></section>

        <section id="evalSummary" class="eval-summary"></section>

        <section id="evalResults"></section>

        <footer class="page-footer">
            <a href="../index.html">Back to Torque Intel</a>
        </footer>

    </main>

    <script src="../agent.js"></script>
    <script src="../tools.js"></script>
    <script src="evaluation.js"></script>

</body>
</html>
