<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Torque Intel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-container">

        <header class="hero">
            <p class="eyebrow">AUTOMOTIVE INTELLIGENCE</p>

            <h1>Torque Intel</h1>

            <p class="subtitle">
                Research vehicle specifications, reliability,
                recalls, and buying considerations.
            </p>
        </header>


        <section class="search-card">

            <label for="userQuestion">
                Ask Torque Intel about a vehicle
            </label>

            <textarea
                id="userQuestion"
                placeholder="Example: I'm considering a 2020 Mustang GT. What engine does it have and what should I know about it?"
            ></textarea>

            <button id="analyzeButton" type="button">
                Analyze Vehicle
            </button>

            <p class="example-text">
                Torque Intel currently covers the Ford Mustang, all trims,
                model years 2015 through 2023.
            </p>

        </section>


        <section
            id="statusArea"
            class="status-area"
            aria-live="polite"
        ></section>

        <footer class="page-footer">
            <a href="evaluation/index.html">Evaluation runner</a>
        </footer>

    </main>

    <!-- Result Modal -->
    <div id="resultModal" class="modal hidden">

        <div
            class="modal-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resultTitle"
        >

            <button
                id="closeModal"
                class="close-button"
                aria-label="Close results"
            >
                ×
            </button>

            <p class="eyebrow">
                TORQUE INTEL RESULT
            </p>

            <h2 id="resultTitle">
                Vehicle Research
            </h2>

            <div id="resultContent"></div>

        </div>

    </div>

    <script src="agent.js"></script>
    <script src="tools.js"></script>
    <script src="app.js"></script>

</body>
</html>
